  <h2>Higher Education Research Endowment Fund
    Instructions for applicants</h2>

  <!-- HREF Registration Form -->
  <div class="container form-container">
    <h2>HREF Registration Form</h2>
  

    <form action="" method="POST" enctype="multipart/form-data">
      <!-- Title of Proposed Project -->
      <label for="title">Title of Proposed Project:</label>
      <input type="text" id="title" name="title" required>

      <!-- Subject -->
      <label for="subject">Subject (e.g. Chemistry):</label>
      <input type="text" id="subject" name="subject" required>

      <!-- Major Field -->
      <label for="major_field">Major Field (e.g. Organic Chemistry):</label>
      <input type="text" id="major_field" name="major_field" required>

      <!-- Minor Field -->
      <label for="minor_field">Minor Field (e.g. drug etc.):</label>
      <input type="text" id="minor_field" name="minor_field" required>

      <!-- Total Funds Requested -->
      <label for="funds_requested">Total Funds Requested (in million):</label>
      <input type="number" id="funds_requested" name="funds_requested" step="0.01" required>

      <!-- Proposed Duration of Project -->
      <label for="duration">Proposed Duration of Project (in months):</label>
      <input type="number" id="duration" name="duration" required>

      <!-- Project Location -->
      <label for="location">Project Location:</label>
      <input type="text" id="location" name="location" required>

      <!-- Proposed Starting Date -->
      <label for="start_date">Proposed Starting Date of Project:</label>
      <input type="date" id="start_date" name="start_date" required>

      <!-- Turnitin Similarity Index -->
      <label for="turnitin_index">Turnitin Similarity Index (%):</label>
      <input type="number" id="turnitin_index" name="turnitin_index" step="0.01" required>

      <!-- Principal Investigator Details -->
      <h4>Details of Principal Investigator (PI)</h4>

      <!-- PI Name -->
      <label for="pi_name">Name:</label>
      <input type="text" id="pi_name" name="pi_name" required>

      <!-- PI Province -->
      <label for="pi_province">Province of the University:</label>
      <input type="text" id="pi_province" name="pi_province" required>

      <!-- PI University -->
      <label for="pi_university">University/Organization/Institution:</label>
      <input type="text" id="pi_university" name="pi_university" required>

      <!-- PI Designation -->
      <label for="pi_designation">Designation (BPS or TTS):</label>
      <input type="text" id="pi_designation" name="pi_designation" required>

      <!-- PI Status -->
      <label for="pi_status">Status (Contract/Regular/Adhoc):</label>
      <input type="text" id="pi_status" name="pi_status" required>

      <!-- Previous Designation -->
      <label for="previous_designation">Previous Designation (if Retired) with BPS:</label>
      <input type="text" id="previous_designation" name="previous_designation">

      <!-- PI Department -->
      <label for="pi_department">Department:</label>
      <input type="text" id="pi_department" name="pi_department" required>

      <!-- PI Office Address -->
      <label for="pi_office_address">Office Address:</label>
      <textarea id="pi_office_address" name="pi_office_address" rows="3" required></textarea>

      <!-- PI CNIC Number -->
      <label for="pi_cnic">CNIC Number:</label>
      <input type="text" id="pi_cnic" name="pi_cnic" required>

      <!-- PI Domicile -->
      <label for="pi_domicile">Domicile:</label>
      <input type="text" id="pi_domicile" name="pi_domicile" required>

      <!-- PI Email Address -->
      <label for="pi_email">Email Address:</label>
      <input type="email" id="pi_email" name="pi_email" required>

      <!-- PI Phone Number -->
      <label for="pi_phone">Cell and Phone #:</label>
      <input type="text" id="pi_phone" name="pi_phone" required>

      <!-- Previous Projects -->
      <label for="previous_projects">Already HEC/S&T/SDU/other submitted projects with ID or reference No.:</label>
      <textarea id="previous_projects" name="previous_projects" rows="3"></textarea>

      <!-- Beneficiary Sector -->
      <label for="beneficiary_sector">Mention beneficiary Sector/industry in KP:</label>
      <input type="text" id="beneficiary_sector" name="beneficiary_sector" required>

    </form>
