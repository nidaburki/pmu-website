<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Management Unit - Login</title>

  <!-- Bootstrap CSS (via CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Additional styles for the circular logo */
    .navbar-brand img {
      border-radius: 50%;
      height: 60px; /* Increased height */
      width: 60px; /* Increased width to maintain circular shape */
    }

    /* Adjusting the search bar and button */
    .navbar .form-inline {
      display: flex;
      justify-content: flex-start;
    }

    .navbar .form-inline input {
      width: 200px; /* Specify width for the search bar */
      margin-right: 10px;
    }

    .navbar .form-inline button {
      margin-left: 10px;
    }

    /* Styling for the login form */
    .login-container {
      background-color: #ffffff; /* White background for the login box */
      border-radius: 8px;
      padding: 30px;
      max-width: 400px; /* Set a fixed width */
      margin: 100px auto; /* Center it vertically and horizontally */
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    /* Green background and text styling for login button */
    .btn-login {
      background-color: #004d00; /* Green background */
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      font-size: 16px;
      border-radius: 4px;
      text-align: center;
    }

    .btn-login:hover {
      background-color: #003b00; /* Darker green on hover */
    }

    .footer {
      background-color: #004d00; /* Green background */
      padding: 20px 0;
      color: white;
      text-align: center;
    }

    .footer .social-icons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .footer .social-icons a {
      color: white;
      font-size: 24px;
      text-decoration: none;
    }

    .footer .social-icons a:hover {
      color: #ddd;
    }

    .footer p {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top" style="background-color: #004d00;">
      <a class="navbar-brand" href="#">
        <img src="images/Picture1.png" alt="Logo" style="height: 60px;"/> <!-- Circular Logo -->
        Project Management Unit
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="scholarship.html">Scholarships</a></li>
          <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
          <li class="nav-item">
            <a class="nav-link" href="research.html">Research</a>
        </li>
          <li class="nav-item"><a class="nav-link" href="alumni.html">Alumni</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="Jobs.html">Jobs</a></li>
          
        </ul>

        <!-- Search Form aligned to the right -->
        <form class="form-inline ms-auto">
          <input class="form-control" type="search" placeholder="Search" aria-label="Search">
          <button class="btn btn-outline-light my-2 my-sm-0" type="submit">Search</button>
        </form>
      </div>
    </nav>
  </header>

  <!-- Login Form -->
  <div class="container">
    <div class="login-container">
      <h3 class="text-center mb-4">Login</h3>
      <form action="#" method="POST">
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-login">Login</button>
      </form>
      <p class="mt-3 text-center">
        Don't have an account? <a href="sign-up.html" style="color: #004d00;">Sign up</a>
      </p>
    </div>
  </div>

  <!-- Footer Section -->
  <div class="footer">
    <div class="social-icons">
      <a href="https://www.facebook.com/pmuhed?mibextid=ZbWKwL" target="_blank"><img src="images/facebook.jpg" alt="Facebook" style="height: 30px; width: 30px;"></a>
      <a href="https://x.com" target="_blank"><img src="images/x.png" alt="x" style="height: 30px; width: 30px;"></a>
      <a href="https://instagram.com" target="_blank"><img src="images/insta.jpg" alt="Instagram" style="height: 30px; width: 30px;"></a>
    </div>
    <p>&copy; 2025 Project Management Unit. All rights reserved.</p>
  </div>

  <!-- Bootstrap JS and Popper.js (via CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

</body>
</html>
