  <!-- Proposal Cover Sheet Form -->
  <div class="container form-container">
    <h2>Cover Sheet of Proposal</h2>
    <form action="submit_proposal_form.php" method="POST" enctype="multipart/form-data">
      
      <!-- Title of Proposed Project -->
      <label for="title">Title of Proposed Project:</label>
      <input type="text" id="title" name="title" required>

      <!-- Domain of Proposed Research -->
      <label>Domain of Proposed Research:</label>
      <div>
        <input type="radio" id="engineering" name="domain" value="Engineering/Applied/Physical Sciences">
        <label for="engineering">Engineering/ Applied /Physical Sciences</label><br>
        <input type="radio" id="medical" name="domain" value="Medical/Biological Sciences">
        <label for="medical">Medical/Biological Sciences</label><br>
        <input type="radio" id="social_sciences" name="domain" value="Social Sciences/Management/IT/Humanities">
        <label for="social_sciences">Social Sciences/ Management/ I.T/ Humanities</label>
      </div>

      <!-- Field of Proposed Research and Specialization -->
      <label for="subject">Subject:</label>
      <input type="text" id="subject" name="subject" required>

      <label for="major_field">Major Field:</label>
      <input type="text" id="major_field" name="major_field" required>

      <label for="minor_field">Minor Field (Specialization):</label>
      <input type="text" id="minor_field" name="minor_field" required>

      <!-- Project Details -->
      <label for="location">Project Location:</label>
      <input type="text" id="location" name="location" required>

      <label for="funds">Total Fund Requested (Rs. in millions):</label>
      <input type="number" id="funds" name="funds" step="0.01" required>

      <label for="duration">Proposed Duration of Project (in months):</label>
      <input type="number" id="duration" name="duration" required>

      <label for="start_date">Proposed Starting Date:</label>
      <input type="date" id="start_date" name="start_date" required>

      <label for="end_date">Proposed End Date:</label>
      <input type="date" id="end_date" name="end_date" required>

      <!-- Principal Investigator (PI) Details -->
      <h4>Details of Principal Investigator (PI)</h4>

      <label for="pi_name">Full Name of PI (First-Middle-Last):</label>
      <input type="text" id="pi_name" name="pi_name" required>

      <label for="pi_degree">Highest Degree:</label>
      <input type="text" id="pi_degree" name="pi_degree" required>

      <label for="pi_position">Position/Title (BPS/TTS):</label>
      <input type="text" id="pi_position" name="pi_position" required>

      <label for="pi_department">Department/Section:</label>
      <input type="text" id="pi_department" name="pi_department" required>

      <label for="pi_university">University/Institution:</label>
      <input type="text" id="pi_university" name="pi_university" required>

      <label for="pi_cnic">CNIC / Passport:</label>
      <input type="text" id="pi_cnic" name="pi_cnic" required>

      <label for="pi_domicile">Domicile:</label>
      <input type="text" id="pi_domicile" name="pi_domicile" required>

      <label for="pi_address">Mailing Address:</label>
      <input type="text" id="pi_address" name="pi_address" required>

      <label for="pi_email">Email:</label>
      <input type="email" id="pi_email" name="pi_email" required>

      <label for="pi_phone">Telephone (Office / Mobile / Res):</label>
      <input type="text" id="pi_phone" name="pi_phone" required>

      <!-- Co-PI Details -->
      <h4>Details of Co-PI</h4>

      <label for="co_pi_name">Full Name of Co-PI (First-Middle-Last):</label>
      <input type="text" id="co_pi_name" name="co_pi_name" required>

      <label for="co_pi_degree">Highest Degree:</label>
      <input type="text" id="co_pi_degree" name="co_pi_degree" required>

      <label for="co_pi_position">Position/Title (BPS/TTS):</label>

      <label for="co_pi_department">Department/Section:</label>

      <label for="co_pi_university">University/Institution:</label>

      <input type="text" id="co_pi_domicile" name="co_pi_domicile" required>

      <input type="text" id="co_pi_address" name="co_pi_address" required>
