`html <!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Animated Candle</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { background: #1a1a1a; min-height: 100vh; display: flex; justify-content: center; align-items: center; } .container { position: relative; width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; } .candle { position: relative; width: 150px; height: 300px; } .candle-body { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 200px; background: linear-gradient(#ffffff, #e0a96d); border-radius: 10px 10px 0 0; box-shadow: inset -10px 0 0 0 #d89a5e; } .flame { position: absolute; top: -50px; left: 50%; transform: translateX(-50%); width: 30px; height: 80px; background: #ffd700; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; animation: flicker 0.1s infinite; box-shadow: 0 0 50px #ffa500; } .flame::before { content: ''; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 15px; height: 40px; background: #ff8c00; border-radius: 50%; } .flame::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 165, 0, 0.2); border-radius: 50%; animation: glow 1s infinite; } .wick { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); width: 4px; height: 20px; background: #333; border-radius: 2px; } .drip { position: absolute; background: #e0a96d; border-radius: 2px; animation: drip 4s infinite; } @keyframes flicker { 0%, 100% { transform: translateX(-50%) scaleY(1); } 50% { transform: translateX(-50%) scaleY(0.95) rotate(2deg); } } @keyframes glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.8; } } @keyframes drip { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(100px); opacity: 0; } } /* Create random wax drips */ .drip:nth-child(1) { left: 30%; width: 8px; height: 15px; animation-delay: 1s; } .drip:nth-child(2) { left: 45%; width: 6px; height: 12px; animation-delay: 3s; } .drip:nth-child(3) { left: 60%; width: 5px; height: 10px; animation-delay: 5s; } /* Responsive Design */ @media (max-width: 768px) { .candle { width: 100px; height: 200px; } .candle-body { height: 150px; } .flame { top: -40px; width: 20px; height: 60px; } } </style> </head> <body> <div class="container"> <div class="candle"> <div class="wick"></div> <div class="flame"></div> <div class="candle-body"></div> <div class="drip"></div> <div class="drip"></div> <div class="drip"></div> </div> </div> </body> </html>
